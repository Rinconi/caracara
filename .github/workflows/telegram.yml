name: 2 - Enviar Telegram Lunes

on:
  schedule:
    - cron: '0 7 * * 1' # Lunes 09:00 España
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fpdf2 requests

      - name: Generar PDF
        run: python generate_report.py

      - name: Enviar a Telegram (con debug)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'PY'
          import os, glob, requests
          token = os.getenv("BOT_TOKEN")
          chat_id = os.getenv("CHAT_ID")

          if not token or not chat_id:
              print("ERROR: Faltan secrets. Revisa que has creado TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID")
              exit(1)

          pdfs = sorted(glob.glob("informes/*.pdf"), key=os.path.getmtime, reverse=True)
          if not pdfs:
              print("ERROR: No hay PDF en informes/")
              exit(1)

          file_path = pdfs[0]
          print(f"Enviando {file_path} a chat {chat_id}...")

          url = f"https://api.telegram.org/bot{token}/sendDocument"
          with open(file_path, 'rb') as f:
              r = requests.post(url, data={"chat_id": chat_id, "caption": "Quiniela Jornada 9"}, files={"document": f})

          print(f"Respuesta Telegram: {r.status_code}")
          print(r.text)

          if r.status_code!= 200:
              exit(1)
          print("OK Enviado!")
          PY
