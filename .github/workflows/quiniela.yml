name: Informe Quiniela H2H

on:
  schedule:
    - cron: '0 8 * * 1,5' # Lunes y Viernes 10:00 España
  workflow_dispatch: # botón para lanzarlo a mano

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python3 generate_report.py
      - name: Commit informe
        run: |
          git config user.name "quiniela-bot"
          git config user.email "bot@quiniela.local"
          git add informes/
          git diff --staged --quiet || git commit -m "Informe H2H $(date +%Y-%m-%d)"
          git push
