- name: Commit informe
  run: |
    git config user.name "quiniela-bot"
    git config user.email "bot@quiniela.local"

    if [ -d "informes" ] && find informes -type f | grep -q .; then
      git add informes/
      git diff --staged --quiet || git commit -m "Informe H2H $(date +%Y-%m-%d)"
      git push
    else
      echo "No se generó ningún informe; no hay nada que publicar."
      exit 1
    fi
